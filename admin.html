<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 锋锋の小站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #FFF5F7;
            --card-bg: #FFFFFF;
            --text-primary: #2D2D3A;
            --text-secondary: #6B6B7A;
            --primary-color: #FF6B9D;
            --secondary-color: #FFB3C6;
            --accent-color: #FF8FB1;
            --purple-color: #C77DFF;
            --border-color: #FFE4E9;
            --shadow-light: 0 4px 12px rgba(255, 107, 157, 0.08), 0 1px 2px rgba(255, 107, 157, 0.06);
            --shadow-hover: 0 6px 16px rgba(255, 107, 157, 0.12), 0 2px 4px rgba(255, 107, 157, 0.08);
            --shadow-card: 0 8px 24px rgba(255, 107, 157, 0.1), 0 2px 8px rgba(255, 107, 157, 0.08);
            --radius-large: 16px;
            --radius-medium: 12px;
            --radius-small: 8px;
            --radius-circle: 50%;
        }

        body {
            font-family: 'Nunito', 'Quicksand', 'M PLUS Rounded 1c', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #FFE4E9 0%, #FFF5F7 100%);
            z-index: -1;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 0 24px;
        }

        .login-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-large);
            padding: 40px 32px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .login-header {
            margin-bottom: 32px;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-circle);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            margin: 0 auto 20px;
            box-shadow: var(--shadow-light);
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-family: 'M PLUS Rounded 1c', 'Nunito', system-ui, sans-serif;
        }

        .login-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .login-hint {
            font-size: 12px;
            color: var(--primary-color);
            margin-top: 8px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-medium);
            font-size: 14px;
            color: var(--text-primary);
            background-color: var(--bg-color);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        .back-link i {
            margin-right: 4px;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 32px 24px;
            }

            .login-icon {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }

            .login-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="login-title">管理员登录</h1>
                <p class="login-desc">请输入您的账号和密码</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <input type="text" id="username" class="form-input" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> 登录
                </button>
            </form>
            <div class="login-footer">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> 返回首页
                </a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const storedPassword = localStorage.getItem('adminPassword') || 'admin';
            
            if (username === 'admin' && password === storedPassword) {
                window.location.href = 'dashboard.html';
            } else {
                alert('用户名或密码错误！');
            }
        });
    </script>
</body>
</html>
