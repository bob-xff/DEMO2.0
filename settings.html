<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 锋锋の小站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #FFF5F7;
            --card-bg: #FFFFFF;
            --text-primary: #2D2D3A;
            --text-secondary: #6B6B7A;
            --primary-color: #FF6B9D;
            --secondary-color: #FFB3C6;
            --accent-color: #FF8FB1;
            --purple-color: #C77DFF;
            --border-color: #FFE4E9;
            --shadow-light: 0 4px 12px rgba(255, 107, 157, 0.08), 0 1px 2px rgba(255, 107, 157, 0.06);
            --shadow-hover: 0 6px 16px rgba(255, 107, 157, 0.12), 0 2px 4px rgba(255, 107, 157, 0.08);
            --shadow-card: 0 8px 24px rgba(255, 107, 157, 0.1), 0 2px 8px rgba(255, 107, 157, 0.08);
            --radius-large: 16px;
            --radius-medium: 12px;
            --radius-small: 8px;
            --radius-circle: 50%;
        }

        body {
            font-family: 'Nunito', 'Quicksand', 'M PLUS Rounded 1c', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 350px;
            background: linear-gradient(180deg, #FFE4E9 0%, #FFF5F7 100%);
            z-index: -1;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .dashboard-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255,255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 12px 0;
            box-shadow: var(--shadow-light);
        }

        .dashboard-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary-color);
            font-family: 'M PLUS Rounded 1c', 'Nunito', system-ui, sans-serif;
            text-decoration: none;
        }

        .dashboard-links {
            display: flex;
            gap: 24px;
        }

        .dashboard-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .dashboard-link:hover {
            color: var(--primary-color);
        }

        .dashboard-link.active {
            color: var(--primary-color);
            font-weight: 600;
        }

        .logout-btn {
            padding: 8px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: var(--accent-color);
            transform: translateY(-1px);
        }

        header {
            padding-top: 100px;
            padding-bottom: 40px;
            text-align: center;
        }

        .name {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            font-family: 'M PLUS Rounded 1c', 'Nunito', system-ui, sans-serif;
        }

        .tagline {
            font-size: 18px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        section {
            margin-bottom: 64px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .section-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-medium);
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color), transparent);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius-large);
            padding: 32px;
            box-shadow: var(--shadow-light);
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            box-shadow: var(--shadow-card);
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-medium);
            font-size: 14px;
            color: var(--text-primary);
            background-color: var(--bg-color);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: var(--radius-medium);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
        }

        .btn-danger {
            background: #EF4444;
            color: white;
        }

        .btn-danger:hover {
            background: #DC2626;
            transform: translateY(-2px);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-info {
            flex: 1;
        }

        .setting-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .setting-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-color);
            transition: 0.3s;
            border-radius: 26px;
        }

        .toggle-slider:before {
            position: absolute;
            content: '';
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--primary-color);
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }

            .name {
                font-size: 36px;
            }

            .tagline {
                font-size: 16px;
            }

            .card {
                padding: 24px;
            }

            .section-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="dashboard-nav">
        <div class="dashboard-content">
            <a href="index.html" class="dashboard-logo">锋锋の小站</a>
            <div class="dashboard-links">
                <a href="dashboard.html" class="dashboard-link">发布文章</a>
                <a href="posts.html" class="dashboard-link">文章管理</a>
                <a href="settings.html" class="dashboard-link active">设置</a>
            </div>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> 退出
            </button>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1 class="name">设置</h1>
            <p class="tagline">管理您的网站设置</p>
        </header>

        <section>
            <div class="section-header">
                <div class="section-icon">
                    <i class="fas fa-user"></i>
                </div>
                <h2 class="section-title">个人信息</h2>
                <div class="section-line"></div>
            </div>
            <div class="card">
                <form id="profileForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="siteName">网站名称</label>
                            <input type="text" id="siteName" class="form-input" value="锋锋の小站">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="siteTagline">网站标语</label>
                            <input type="text" id="siteTagline" class="form-input" value="欢迎来到我的个人空间">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="adminEmail">管理员邮箱</label>
                        <input type="email" id="adminEmail" class="form-input" value="admin@example.com">
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 保存更改
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <div class="section-header">
                <div class="section-icon">
                    <i class="fas fa-cog"></i>
                </div>
                <h2 class="section-title">网站设置</h2>
                <div class="section-line"></div>
            </div>
            <div class="card">
                <div class="setting-item">
                    <div class="setting-info">
                        <h3 class="setting-title">允许评论</h3>
                        <p class="setting-desc">允许访客在文章下发表评论</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-info">
                        <h3 class="setting-title">显示阅读量</h3>
                        <p class="setting-desc">在文章列表中显示阅读量</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-info">
                        <h3 class="setting-title">允许点赞</h3>
                        <p class="setting-desc">允许访客点赞文章</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <div class="setting-info">
                        <h3 class="setting-title">网站维护模式</h3>
                        <p class="setting-desc">启用后网站将暂时关闭</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <section>
            <div class="section-header">
                <div class="section-icon">
                    <i class="fas fa-images"></i>
                </div>
                <h2 class="section-title">轮播图片管理</h2>
                <div class="section-line"></div>
            </div>
            <div class="card">
                <form id="imagesForm">
                    <div class="form-group">
                        <label class="form-label">图片1</label>
                        <input type="text" id="image1" class="form-input" value="1.jpg" placeholder="请输入图片路径">
                    </div>
                    <div class="form-group">
                        <label class="form-label">图片2</label>
                        <input type="text" id="image2" class="form-input" value="2.jpg" placeholder="请输入图片路径">
                    </div>
                    <div class="form-group">
                        <label class="form-label">图片3</label>
                        <input type="text" id="image3" class="form-input" value="3.jpg" placeholder="请输入图片路径">
                    </div>
                    <div class="form-group">
                        <label class="form-label">图片4</label>
                        <input type="text" id="image4" class="form-input" value="4.jpg" placeholder="请输入图片路径">
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 保存图片设置
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <div class="section-header">
                <div class="section-icon">
                    <i class="fas fa-quote-right"></i>
                </div>
                <h2 class="section-title">励志语句管理</h2>
                <div class="section-line"></div>
            </div>
            <div class="card">
                <form id="quotesForm">
                    <div class="form-group">
                        <label class="form-label">励志语句1</label>
                        <input type="text" id="quote1" class="form-input" value="每一个不曾起舞的日子，都是对生命的辜负" placeholder="请输入励志语句">
                    </div>
                    <div class="form-group">
                        <label class="form-label">励志语句2</label>
                        <input type="text" id="quote2" class="form-input" value="生活不是等待风暴过去，而是学会在雨中跳舞" placeholder="请输入励志语句">
                    </div>
                    <div class="form-group">
                        <label class="form-label">励志语句3</label>
                        <input type="text" id="quote3" class="form-input" value="星光不问赶路人，时光不负有心人" placeholder="请输入励志语句">
                    </div>
                    <div class="form-group">
                        <label class="form-label">励志语句4</label>
                        <input type="text" id="quote4" class="form-input" value="努力的意义，就是以后的日子里，放眼望去，全部都是自己喜欢的人和事" placeholder="请输入励志语句">
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 保存励志语句
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <div class="section-header">
                <div class="section-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <h2 class="section-title">关于内容管理</h2>
                <div class="section-line"></div>
            </div>
            <div class="card">
                <form id="aboutForm">
                    <div class="form-group">
                        <label class="form-label" for="aboutText1">第一段</label>
                        <textarea id="aboutText1" class="form-input" rows="3" placeholder="请输入关于内容第一段">这里是锋锋，一个热爱生活的普通人。</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="aboutText2">第二段</label>
                        <textarea id="aboutText2" class="form-input" rows="3" placeholder="请输入关于内容第二段">喜欢动漫、游戏、编程和一切美好的事物。相信简单的生活也能充满色彩。</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="aboutText3">第三段</label>
                        <textarea id="aboutText3" class="form-input" rows="3" placeholder="请输入关于内容第三段">这个网站是我记录生活、分享想法的小天地。希望这里能给你带来一些温暖和快乐。</textarea>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 保存关于内容
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <div class="section-header">
                <div class="section-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2 class="section-title">安全设置</h2>
                <div class="section-line"></div>
            </div>
            <div class="card">
                <form id="securityForm">
                    <div class="form-group">
                        <label class="form-label" for="currentPassword">当前密码</label>
                        <input type="password" id="currentPassword" class="form-input" placeholder="请输入当前密码">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="newPassword">新密码</label>
                            <input type="password" id="newPassword" class="form-input" placeholder="请输入新密码">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="confirmPassword">确认密码</label>
                            <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入新密码">
                        </div>
                    </div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-key"></i> 更新密码
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <div class="section-header">
                <div class="section-icon">
                    <i class="fas fa-trash"></i>
                </div>
                <h2 class="section-title">危险区域</h2>
                <div class="section-line"></div>
            </div>
            <div class="card">
                <p style="color: var(--text-secondary); margin-bottom: 16px;">以下操作不可逆，请谨慎操作。</p>
                <div class="btn-group">
                    <button class="btn btn-danger" onclick="clearCache()">
                        <i class="fas fa-broom"></i> 清除缓存
                    </button>
                    <button class="btn btn-danger" onclick="resetSettings()">
                        <i class="fas fa-undo"></i> 重置设置
                    </button>
                </div>
            </div>
        </section>
    </div>

    <script>
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                window.location.href = 'admin.html';
            }
        }

        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('个人信息已保存！');
        });

        document.getElementById('imagesForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const images = {
                image1: document.getElementById('image1').value,
                image2: document.getElementById('image2').value,
                image3: document.getElementById('image3').value,
                image4: document.getElementById('image4').value
            };
            localStorage.setItem('carouselImages', JSON.stringify(images));
            alert('轮播图片设置已保存！');
        });

        document.getElementById('quotesForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const quotes = [
                document.getElementById('quote1').value,
                document.getElementById('quote2').value,
                document.getElementById('quote3').value,
                document.getElementById('quote4').value
            ];
            localStorage.setItem('inspirationalQuotes', JSON.stringify(quotes));
            alert('励志语句已保存！');
        });

        document.getElementById('aboutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const aboutText = {
                text1: document.getElementById('aboutText1').value,
                text2: document.getElementById('aboutText2').value,
                text3: document.getElementById('aboutText3').value
            };
            localStorage.setItem('aboutContent', JSON.stringify(aboutText));
            alert('关于内容已保存！');
        });

        document.getElementById('securityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            const storedPassword = localStorage.getItem('adminPassword') || 'admin';
            
            if (currentPassword !== storedPassword) {
                alert('当前密码错误！');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                alert('两次输入的密码不一致！');
                return;
            }
            
            if (newPassword.length < 4) {
                alert('密码长度不能少于4位！');
                return;
            }
            
            localStorage.setItem('adminPassword', newPassword);
            alert('密码已更新！');
            this.reset();
        });

        function clearCache() {
            if (confirm('确定要清除所有缓存吗？')) {
                alert('缓存已清除！');
            }
        }

        function resetSettings() {
            if (confirm('确定要重置所有设置吗？此操作不可逆！')) {
                alert('设置已重置！');
            }
        }
    </script>
</body>
</html>
