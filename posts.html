<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理 - 锋锋の小站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #FFF5F7;
            --card-bg: #FFFFFF;
            --text-primary: #2D2D3A;
            --text-secondary: #6B6B7A;
            --primary-color: #FF6B9D;
            --secondary-color: #FFB3C6;
            --accent-color: #FF8FB1;
            --purple-color: #C77DFF;
            --border-color: #FFE4E9;
            --shadow-light: 0 4px 12px rgba(255, 107, 157, 0.08), 0 1px 2px rgba(255, 107, 157, 0.06);
            --shadow-hover: 0 6px 16px rgba(255, 107, 157, 0.12), 0 2px 4px rgba(255, 107, 157, 0.08);
            --shadow-card: 0 8px 24px rgba(255, 107, 157, 0.1), 0 2px 8px rgba(255, 107, 157, 0.08);
            --radius-large: 16px;
            --radius-medium: 12px;
            --radius-small: 8px;
            --radius-circle: 50%;
        }

        body {
            font-family: 'Nunito', 'Quicksand', 'M PLUS Rounded 1c', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 350px;
            background: linear-gradient(180deg, #FFE4E9 0%, #FFF5F7 100%);
            z-index: -1;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .dashboard-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255,255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 12px 0;
            box-shadow: var(--shadow-light);
        }

        .dashboard-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary-color);
            font-family: 'M PLUS Rounded 1c', 'Nunito', system-ui, sans-serif;
            text-decoration: none;
        }

        .dashboard-links {
            display: flex;
            gap: 24px;
        }

        .dashboard-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .dashboard-link:hover {
            color: var(--primary-color);
        }

        .dashboard-link.active {
            color: var(--primary-color);
            font-weight: 600;
        }

        .logout-btn {
            padding: 8px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: var(--accent-color);
            transform: translateY(-1px);
        }

        header {
            padding-top: 100px;
            padding-bottom: 40px;
            text-align: center;
        }

        .name {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            font-family: 'M PLUS Rounded 1c', 'Nunito', system-ui, sans-serif;
        }

        .tagline {
            font-size: 18px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        section {
            margin-bottom: 64px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .section-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-medium);
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color), transparent);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius-large);
            padding: 32px;
            box-shadow: var(--shadow-light);
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            box-shadow: var(--shadow-card);
            transform: translateY(-2px);
        }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-medium);
            font-size: 14px;
            color: var(--text-primary);
            background-color: var(--bg-color);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-btn {
            padding: 12px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-medium);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-btn:hover {
            background: var(--accent-color);
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            background: white;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-medium);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post-item {
            background-color: var(--card-bg);
            border-radius: var(--radius-large);
            padding: 20px;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .post-item:hover {
            box-shadow: var(--shadow-card);
            transform: translateY(-2px);
        }

        .post-info {
            flex: 1;
        }

        .post-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .post-meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .post-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: var(--radius-small);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .action-btn.edit {
            background: #E8F4FD;
            color: #3B82F6;
        }

        .action-btn.edit:hover {
            background: #DBEAFE;
        }

        .action-btn.delete {
            background: #FEE2E2;
            color: #EF4444;
        }

        .action-btn.delete:hover {
            background: #FECACA;
        }

        .action-btn.view {
            background: #DCFCE7;
            color: #10B981;
        }

        .action-btn.view:hover {
            background: #BBF7D0;
        }

        @media (max-width: 768px) {
            .post-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .post-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .search-bar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="dashboard-nav">
        <div class="dashboard-content">
            <a href="index.html" class="dashboard-logo">锋锋の小站</a>
            <div class="dashboard-links">
                <a href="dashboard.html" class="dashboard-link">发布文章</a>
                <a href="posts.html" class="dashboard-link active">文章管理</a>
                <a href="settings.html" class="dashboard-link">设置</a>
            </div>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> 退出
            </button>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1 class="name">文章管理</h1>
            <p class="tagline">管理您的所有文章</p>
        </header>

        <section>
            <div class="section-header">
                <div class="section-icon">
                    <i class="fas fa-list"></i>
                </div>
                <h2 class="section-title">文章列表</h2>
                <div class="section-line"></div>
            </div>
            <div class="card">
                <div class="search-bar">
                    <input type="text" class="search-input" placeholder="搜索文章标题...">
                    <button class="search-btn">
                        <i class="fas fa-search"></i> 搜索
                    </button>
                </div>
                <div class="filter-bar">
                    <button class="filter-btn active">全部</button>
                    <button class="filter-btn">生活</button>
                    <button class="filter-btn">技术</button>
                    <button class="filter-btn">动漫</button>
                    <button class="filter-btn">游戏</button>
                </div>
                <div class="posts-list">
                    <div class="post-item">
                        <div class="post-info">
                            <h3 class="post-title">网站正式上线</h3>
                            <div class="post-meta">
                                <span><i class="fas fa-calendar"></i> 2024-01-15</span>
                                <span><i class="fas fa-folder"></i> 生活</span>
                                <span><i class="fas fa-eye"></i> 128</span>
                                <span><i class="fas fa-heart"></i> 32</span>
                            </div>
                        </div>
                        <div class="post-actions">
                            <button class="action-btn view">
                                <i class="fas fa-eye"></i> 查看
                            </button>
                            <button class="action-btn edit">
                                <i class="fas fa-edit"></i> 编辑
                            </button>
                            <button class="action-btn delete">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                    <div class="post-item">
                        <div class="post-info">
                            <h3 class="post-title">新功能开发中</h3>
                            <div class="post-meta">
                                <span><i class="fas fa-calendar"></i> 2024-01-10</span>
                                <span><i class="fas fa-folder"></i> 技术</span>
                                <span><i class="fas fa-eye"></i> 96</span>
                                <span><i class="fas fa-heart"></i> 24</span>
                            </div>
                        </div>
                        <div class="post-actions">
                            <button class="action-btn view">
                                <i class="fas fa-eye"></i> 查看
                            </button>
                            <button class="action-btn edit">
                                <i class="fas fa-edit"></i> 编辑
                            </button>
                            <button class="action-btn delete">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                    <div class="post-item">
                        <div class="post-info">
                            <h3 class="post-title">开始建设</h3>
                            <div class="post-meta">
                                <span><i class="fas fa-calendar"></i> 2024-01-05</span>
                                <span><i class="fas fa-folder"></i> 日记</span>
                                <span><i class="fas fa-eye"></i> 64</span>
                                <span><i class="fas fa-heart"></i> 18</span>
                            </div>
                        </div>
                        <div class="post-actions">
                            <button class="action-btn view">
                                <i class="fas fa-eye"></i> 查看
                            </button>
                            <button class="action-btn edit">
                                <i class="fas fa-edit"></i> 编辑
                            </button>
                            <button class="action-btn delete">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                    <div class="post-item">
                        <div class="post-info">
                            <h3 class="post-title">新年快乐</h3>
                            <div class="post-meta">
                                <span><i class="fas fa-calendar"></i> 2024-01-01</span>
                                <span><i class="fas fa-folder"></i> 节日</span>
                                <span><i class="fas fa-eye"></i> 156</span>
                                <span><i class="fas fa-heart"></i> 42</span>
                            </div>
                        </div>
                        <div class="post-actions">
                            <button class="action-btn view">
                                <i class="fas fa-eye"></i> 查看
                            </button>
                            <button class="action-btn edit">
                                <i class="fas fa-edit"></i> 编辑
                            </button>
                            <button class="action-btn delete">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                window.location.href = 'admin.html';
            }
        }

        function loadPosts(filter = '全部') {
            const posts = JSON.parse(localStorage.getItem('blogPosts')) || [];
            const postsList = document.querySelector('.posts-list');
            postsList.innerHTML = '';

            const filteredPosts = filter === '全部' ? posts : posts.filter(p => p.category === filter);

            filteredPosts.forEach(post => {
                const postItem = document.createElement('div');
                postItem.className = 'post-item';
                postItem.innerHTML = `
                    <div class="post-info">
                        <h3 class="post-title">${post.title}</h3>
                        <div class="post-meta">
                            <span><i class="fas fa-calendar"></i> ${post.date}</span>
                            <span><i class="fas fa-folder"></i> ${post.category}</span>
                            <span><i class="fas fa-eye"></i> ${post.views}</span>
                            <span><i class="fas fa-heart"></i> ${post.likes}</span>
                        </div>
                    </div>
                    <div class="post-actions">
                        <button class="action-btn view" onclick="viewPost(${post.id})">
                            <i class="fas fa-eye"></i> 查看
                        </button>
                        <button class="action-btn edit" onclick="editPost(${post.id})">
                            <i class="fas fa-edit"></i> 编辑
                        </button>
                        <button class="action-btn delete" onclick="deletePost(${post.id})">
                            <i class="fas fa-trash"></i> 删除
                        </button>
                    </div>
                `;
                postsList.appendChild(postItem);
            });
        }

        function viewPost(postId) {
            const posts = JSON.parse(localStorage.getItem('blogPosts')) || [];
            const post = posts.find(p => p.id === postId);
            if (post) {
                alert(`标题：${post.title}\n分类：${post.category}\n日期：${post.date}\n内容：${post.content}`);
            }
        }

        function editPost(postId) {
            const posts = JSON.parse(localStorage.getItem('blogPosts')) || [];
            const post = posts.find(p => p.id === postId);
            if (post) {
                window.location.href = `dashboard.html?edit=${postId}`;
            }
        }

        function deletePost(postId) {
            if (confirm('确定要删除这篇文章吗？')) {
                let posts = JSON.parse(localStorage.getItem('blogPosts')) || [];
                posts = posts.filter(p => p.id !== postId);
                localStorage.setItem('blogPosts', JSON.stringify(posts));
                loadPosts();
            }
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                loadPosts(this.textContent);
            });
        });

        loadPosts();
    </script>
</body>
</html>
