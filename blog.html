<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态 - 锋锋の小站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #FFF5F7;
            --card-bg: #FFFFFF;
            --text-primary: #2D2D3A;
            --text-secondary: #6B6B7A;
            --primary-color: #FF6B9D;
            --secondary-color: #FFB3C6;
            --accent-color: #FF8FB1;
            --purple-color: #C77DFF;
            --border-color: #FFE4E9;
            --shadow-light: 0 4px 12px rgba(255, 107, 157, 0.08), 0 1px 2px rgba(255, 107, 157, 0.06);
            --shadow-hover: 0 6px 16px rgba(255, 107, 157, 0.12), 0 2px 4px rgba(255, 107, 157, 0.08);
            --shadow-card: 0 8px 24px rgba(255, 107, 157, 0.1), 0 2px 8px rgba(255, 107, 157, 0.08);
            --radius-large: 16px;
            --radius-medium: 12px;
            --radius-small: 8px;
            --radius-circle: 50%;
        }

        body {
            font-family: 'Nunito', 'Quicksand', 'M PLUS Rounded 1c', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 350px;
            background: linear-gradient(180deg, #FFE4E9 0%, #FFF5F7 100%);
            z-index: -1;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 12px 0;
            transition: all 0.3s ease;
        }

        .nav-bar.scrolled {
            box-shadow: var(--shadow-light);
        }

        .nav-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--primary-color);
            font-family: 'M PLUS Rounded 1c', 'Nunito', system-ui, sans-serif;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        .nav-link.active {
            color: var(--primary-color);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
        }

        header {
            padding-top: 100px;
            padding-bottom: 40px;
            text-align: center;
        }

        @media (max-width: 768px) {
            header {
                padding-top: 80px;
                padding-bottom: 32px;
            }
        }

        .name {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            font-family: 'M PLUS Rounded 1c', 'Nunito', system-ui, sans-serif;
        }

        .tagline {
            font-size: 18px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        section {
            margin-bottom: 64px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .section-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-medium);
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0;
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color), transparent);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius-large);
            padding: 32px;
            box-shadow: var(--shadow-light);
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            box-shadow: var(--shadow-card);
            transform: translateY(-2px);
        }

        .blog-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .blog-item {
            background-color: var(--card-bg);
            border-radius: var(--radius-large);
            padding: 24px;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .blog-item:hover {
            box-shadow: var(--shadow-card);
            transform: translateY(-4px);
        }

        .blog-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 16px;
        }

        .blog-date {
            flex-shrink: 0;
            width: 100px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            padding-top: 4px;
        }

        .blog-content {
            flex: 1;
        }

        .blog-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .blog-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .blog-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background-color: #F0F0F2;
            color: var(--text-primary);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: var(--radius-small);
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .tag:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .blog-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
        }

        .blog-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
            font-size: 14px;
            border-top: 1px solid var(--border-color);
            margin-top: 48px;
        }

        .back-to-top {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 48px;
            height: 48px;
            border-radius: var(--radius-medium);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--shadow-card);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card);
        }

        @media (max-width: 768px) {
            .back-to-top {
                bottom: 24px;
                right: 24px;
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }

            .name {
                font-size: 36px;
            }

            .tagline {
                font-size: 16px;
            }

            .card {
                padding: 24px;
            }

            .section-title {
                font-size: 20px;
            }

            .blog-header {
                flex-direction: column;
            }

            .blog-date {
                width: auto;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-content">
            <a href="index.html" class="nav-logo">锋锋の小站</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">主页</a>
                <a href="about.html" class="nav-link">关于</a>
                <a href="blog.html" class="nav-link active">动态</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1 class="name">动态</h1>
            <p class="tagline">记录生活中的点点滴滴</p>
        </header>

        <section>
            <div class="section-header">
                <div class="section-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h2 class="section-title">最新动态</h2>
                <div class="section-line"></div>
            </div>
            <div class="blog-list" id="blogList">
            </div>
        </section>

        <footer>
            <p>&copy; 2024 锋锋の小站. All rights reserved.</p>
        </footer>
        <button class="back-to-top" id="backToTop">
            <i class="fas fa-arrow-up"></i>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const navBar = document.querySelector('.nav-bar');
            const backToTop = document.getElementById('backToTop');
            const sections = document.querySelectorAll('section');

            function loadBlogPosts() {
                const posts = JSON.parse(localStorage.getItem('blogPosts')) || [];
                const blogList = document.getElementById('blogList');
                blogList.innerHTML = '';

                posts.forEach(post => {
                    const blogItem = document.createElement('article');
                    blogItem.className = 'blog-item';
                    blogItem.innerHTML = `
                        <div class="blog-header">
                            <div class="blog-date">${post.date}</div>
                            <div class="blog-content">
                                <h3 class="blog-title">${post.title}</h3>
                                <p class="blog-desc">${post.content.substring(0, 100)}...</p>
                                <div class="blog-tags">
                                    ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                </div>
                                <div class="blog-meta">
                                    <span><i class="fas fa-eye"></i> ${post.views}</span>
                                    <span><i class="fas fa-heart"></i> ${post.likes}</span>
                                    <span><i class="fas fa-comment"></i> ${post.comments}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    blogList.appendChild(blogItem);
                });
            }

            loadBlogPosts();

            function loadBlogPosts() {
                const posts = JSON.parse(localStorage.getItem('blogPosts')) || [];
                const blogList = document.getElementById('blogList');
                blogList.innerHTML = '';

                posts.forEach(post => {
                    const blogItem = document.createElement('article');
                    blogItem.className = 'blog-item';
                    blogItem.innerHTML = `
                        <div class="blog-header">
                            <div class="blog-date">${post.date}</div>
                            <div class="blog-content">
                                <h3 class="blog-title">${post.title}</h3>
                                <p class="blog-desc">${post.content.substring(0, 100)}...</p>
                                <div class="blog-tags">
                                    ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                </div>
                                <div class="blog-meta">
                                    <span><i class="fas fa-eye"></i> ${post.views}</span>
                                    <span><i class="fas fa-heart"></i> ${post.likes}</span>
                                    <span><i class="fas fa-comment"></i> ${post.comments}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    blogList.appendChild(blogItem);
                });
            }

            loadBlogPosts();

            window.addEventListener('scroll', function() {
                if (window.scrollY > 50) {
                    navBar.classList.add('scrolled');
                } else {
                    navBar.classList.remove('scrolled');
                }

                if (window.scrollY > 300) {
                    backToTop.classList.add('visible');
                } else {
                    backToTop.classList.remove('visible');
                }
            });

            backToTop.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });

            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);

            sections.forEach(section => {
                observer.observe(section);
            });
        });
    </script>
</body>
</html>
